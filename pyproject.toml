[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luct-ai"
version = "0.1.0"
description = "LUCT Market used-laptop asking-price estimator (Phase 8 dataset + Phase 9 models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ipykernel>=6.29"]

[project.scripts]
luct-ai = "luct_ai.pipeline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
